[package]
name = "silicon-bridge"
version = "0.1.0"
edition = "2024"
# Declared as current stable by policy, not as the dependency-derived floor:
# edition 2024 only requires 1.85.0, and `getrandom` 0.4 (via the `tempfile`
# dev-dependency) needs no more than that either — 1.85.0 is the actual
# minimum the graph requires. This crate tracks stable instead. Checked
# against the 1.98.1 toolchain.
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Deploy spiking neural networks to FPGAs: Q8.8 fixed-point export, optional UART spike I/O, and Vivado timing-report parsing for CI gating"
repository = "https://github.com/rmems/silicon-bridge"
documentation = "https://docs.rs/silicon-bridge"
readme = "README.md"
keywords = ["snn", "fpga", "neuromorphic", "silicon", "q8-8"]
categories = ["science", "hardware-support", "algorithms"]
# Allow-list rather than `exclude = ["docs/"]`: an exclude list silently ships
# anything added later, which is how AGENTS.md, CLAUDE.md, REVIEW.md, .codacy.yml
# and .github/ ended up in the published tarball. docs/ stays out — logo.png
# alone is 2.4 MB, and crates.io resolves the README's relative links against
# `repository`.
include = [
    "src/**/*.rs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
name = "silicon_bridge"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
serialport = { version = "4.3", optional = true }

[features]
default = []
uart = ["serialport"]

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
