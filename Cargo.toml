[package]
name = "silicon-bridge"
version = "0.3.1"
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
edition = "2024"
# Raised to 1.99.0 (stable at 2026-10-01) by explicit decision; the language
# features in use (edition 2024, `if`/`let` chains) only need 1.88.0. CI
# enforces this floor via a dedicated 1.99.0 job and separately exercises
# GitHub Actions `stable`.
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
description = "Deploy spiking neural networks to FPGAs: Q8.8 fixed-point export, optional UART spike I/O, and Vivado timing-report parsing for CI gating"
repository = "https://github.com/rmems/silicon-bridge"
homepage = "https://github.com/rmems/silicon-bridge"
documentation = "https://docs.rs/silicon-bridge"
readme = "README.md"
keywords = ["snn", "fpga", "neuromorphic", "silicon", "q8-8"]
categories = ["science", "hardware-support", "algorithms"]
# Allow-list rather than `exclude = ["docs/"]`: an exclude list silently ships
# anything added later, which is how AGENTS.md, CLAUDE.md, REVIEW.md, .codacy.yml
# and .github/ ended up in the published tarball. `docs/logo.png` stays out
# (2.4 MB). Consumer, export-profile, and release-readiness markdown files the
# README links are included so an unpacked package still has those guides.
# `examples/` ships so a packaged-crate consumer can compile the public demos
# without a git checkout.
include = [
    "build.rs",
    "src/**/*.rs",
    "examples/**/*.rs",
    "examples/README.md",
    "docs/consumer.md",
    "docs/export-profiles.md",
    "docs/hardware-smoke-note.md",
    "docs/host-hdl-contract.md",
    "docs/uart-v4-protocol.md",
    "docs/release-readiness.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
name = "silicon_bridge"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
serialport = { version = "4.3", optional = true }
nir-rs = { version = "=0.4.5", optional = true, default-features = false }

[features]
default = []
uart = ["serialport"]
nir = ["dep:nir-rs"]
# Opt-in `.nir` (HDF5) file I/O via `nir_rs::io`. Links native libhdf5, so it is
# kept out of `default` and out of the MSRV job.
nir-io = ["nir", "nir-rs/hdf5"]

[dev-dependencies]
tempfile = "3.10"
sha2 = "0.11"
proptest = "1.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Fast iteration: incremental compiles, full debug info, no optimization.
# Library dependents ignore root-package [profile.*] settings.
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Slightly optimized so the unit/doctest suite runs faster without
# slowing compile much relative to `dev`.
[profile.test]
inherits = "dev"
opt-level = 1

# Mirrors `release` so future Criterion benches reflect real performance;
# keep debug symbols for later profiler / Criterion symbolization.
[profile.bench]
inherits = "release"
debug = true
strip = false
