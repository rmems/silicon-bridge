[package]
name = "silicon-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Deploy spiking neural networks to any FPGA: Q8.8 fixed-point parameter export to Verilog $readmemh, optional synchronous UART spike I/O, and Vivado timing-report parsing for CI gating"
repository = "https://github.com/rmems/silicon-bridge"
keywords = ["snn", "fpga", "neuromorphic", "silicon", "q8-8"]
categories = ["science", "hardware-support", "algorithms"]
exclude = ["docs/"]

[lib]
name = "silicon_bridge"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
serialport = { version = "4.3", optional = true }

[features]
default = []
uart = ["serialport"]

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
