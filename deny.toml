# Dependency policy for CI (`cargo deny check advisories`) and optional local
# license checks. `Cargo.lock` is intentionally uncommitted (see
# `.github/dependabot.yml`); each run resolves fresh crate versions against
# the feature set below.
#
# CI fails the build on reported vulnerabilities (RustSec advisories). License
# checking is configured for maintainers who run `cargo deny check licenses`
# locally; the workflow gate is advisories-only.

[graph]
# Feature-enabled dependency graph for advisory checks (metadata only; no native
# link step). Matches supported optional features, including `nir-io` / HDF5.
features = ["uart", "nir", "nir-io"]

[advisories]
version = 2
ignore = [
    # Example: { id = "RUSTSEC-0000-0000", reason = "document why" },
]

# SPDX allow-list for optional `cargo deny check licenses` (not run in CI yet).
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
