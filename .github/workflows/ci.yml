name: CI

on:
  push:
    branches: [main]
  # No `branches` filter. Restricting this to `main` silently skipped CI on any
  # pull request stacked on another PR's branch, so a stacked change could reach
  # `main` having never been built. The `push` trigger above keeps post-merge
  # builds limited to `main`.
  pull_request:

permissions:
  contents: read

jobs:
  # Pins the toolchain to `[package].rust-version` so the advertised floor cannot
  # drift silently. UART (`--features uart`) is included with libudev on Linux.
  # `--all-features` is intentionally omitted: the optional `nir` feature pins
  # `nir-rs`, whose own MSRV is above 1.88.0 (see README / release-readiness).
  msrv:
    name: msrv (1.88.0, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0 (MSRV)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.88.0

      - name: Verify MSRV toolchain
        run: rustc --version | grep -F '1.88.0'

      - name: Install libudev (serialport / uart feature)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-1.88.0-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-1.88.0-
            ${{ runner.os }}-cargo-

      - name: Check (default features)
        run: cargo check --all-targets

      - name: Test (default features)
        run: cargo test

      - name: Check (uart feature)
        run: cargo check --all-targets --features uart

      - name: Test (uart feature)
        run: cargo test --features uart

  # Formatting is OS-independent, so it runs once on Linux to save runner minutes.
  fmt:
    name: fmt (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          components: rustfmt
          toolchain: stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Check fuzz-target formatting
        run: cargo fmt --check --manifest-path fuzz/Cargo.toml

  # Default features (no `uart`) on every supported host OS.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          components: clippy
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-default-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-default-
            ${{ runner.os }}-cargo-

      - name: Clippy (lint)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  # `uart` pulls in `serialport`, which needs libudev on Linux.
  # Unit tests only — no serial hardware is attached to CI runners.
  uart:
    name: uart (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          components: clippy
          toolchain: stable

      - name: Install libudev
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-uart-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-uart-
            ${{ runner.os }}-cargo-

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check (uart feature)
        run: cargo check --features uart

      - name: Test (all features)
        run: cargo test --all-features

      # `cargo test --all-features` builds examples but does not run their
      # inline `#[test]`s; `--examples` selects those test targets so the
      # uart_host_smoke offline harness tests actually execute in CI.
      - name: Test examples (all features)
        run: cargo test --all-features --examples

      # AGENTS.md bans relative links to licence files in doc comments because
      # they break on docs.rs — a rule that exists precisely because nothing
      # rendered the docs. This runs on the uart job because libudev is already
      # installed here, so `--features uart` covers every public item at once.
      - name: Rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --features uart

  # Compile libFuzzer targets only. Long campaigns stay opt-in via
  # `cargo fuzz run <target>` (see fuzz/README.md). No serialport / FPGA.
  fuzz:
    name: fuzz-build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: nightly

      - name: Install C++ toolchain for libFuzzer
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-
            ${{ runner.os }}-cargo-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        env:
          CC: gcc
          CXX: g++
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: g++
        run: cargo +nightly fuzz build --dev --sanitizer none
