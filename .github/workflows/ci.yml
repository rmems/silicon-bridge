name: CI

on:
  push:
    branches: [main]
  # No `branches` filter. Restricting this to `main` silently skipped CI on any
  # pull request stacked on another PR's branch, so a stacked change could reach
  # `main` having never been built. The `push` trigger above keeps post-merge
  # builds limited to `main`.
  pull_request:

permissions:
  contents: read

jobs:
  # Formatting is OS-independent, so it runs once on Linux to save runner minutes.
  fmt:
    name: fmt (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          components: rustfmt
          toolchain: stable

      - name: Check formatting
        run: cargo fmt --check

  # Default features (no `uart`) on every supported host OS.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          components: clippy
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-default-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-default-
            ${{ runner.os }}-cargo-

      - name: Clippy (lint)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  # `uart` pulls in `serialport`, which needs libudev on Linux.
  # Unit tests only — no serial hardware is attached to CI runners.
  uart:
    name: uart (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Install libudev
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-uart-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-uart-
            ${{ runner.os }}-cargo-

      - name: Check (uart feature)
        run: cargo check --features uart

      - name: Test (uart feature)
        run: cargo test --features uart

      # AGENTS.md bans relative links to licence files in doc comments because
      # they break on docs.rs — a rule that exists precisely because nothing
      # rendered the docs. This runs on the uart job because libudev is already
      # installed here, so `--features uart` covers every public item at once.
      - name: Rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --features uart
