name: Hardware project board

on:
  issues:
    types: [opened, reopened, transferred, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to sync (default: all open issues)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  sync-project:
    runs-on: ubuntu-latest
    steps:
      - name: Sync issue(s) with the rmems consolidation project
        env:
          # PROJECTS_TOKEN is a classic PAT carrying the `project` scope. The
          # default GITHUB_TOKEN cannot touch ProjectsV2, so without
          # PROJECTS_TOKEN this job no-ops (see the preflight below) rather than
          # failing the run.
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN != '' }}
          # rmems user project #5 "Limen-Neural Consolidation".
          # The previous IDs pointed at Limen-Neural org project #8 "Hardware",
          # which this repository left during the org transfer (#27).
          PROJECT_ID: PVT_kwHODs2Zb84BfcTG
          STATUS_FIELD_ID: PVTSSF_lAHODs2Zb84BfcTGzhZvKog
          OPT_READY: "61e4505c"
          OPT_DONE: "98236657"
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUM_EVENT: ${{ github.event.issue.number }}
          ISSUE_STATE_EVENT: ${{ github.event.issue.state }}
          DISPATCH_NUM: ${{ inputs.issue_number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # Skip on a setup gap, fail on a real error. An `issues` event fires on
          # every open and close, so an unusable token must not paint the whole
          # repository red; an explicit workflow_dispatch must never silently
          # no-op. Anything past this preflight is a genuine failure.
          skip_or_fail() {
            echo "::warning title=Project board sync skipped::$1"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "workflow_dispatch was explicit - failing instead of skipping." >&2
              exit 1
            fi
            exit 0
          }

          # 1. Is a token configured at all? Without PROJECTS_TOKEN, GH_TOKEN
          #    falls back to GITHUB_TOKEN, which cannot touch ProjectsV2 under
          #    any circumstances.
          if [ "$HAS_PROJECTS_TOKEN" != "true" ]; then
            skip_or_fail "secrets.PROJECTS_TOKEN is not set; ProjectsV2 needs a PAT with the 'project' scope."
          fi

          # 2. Can that token actually reach this project? Presence is not
          #    access: a PAT can be expired, mis-scoped, or simply belong to an
          #    account without rights to PROJECT_ID, and each of those failed
          #    the same way the missing-token case used to. One cheap read
          #    settles it before any mutation is attempted.
          #
          #    The query itself is captured (not just its exit code) for two
          #    reasons: `node(id:)` returns a *null* node rather than a GraphQL
          #    error for an inaccessible/nonexistent id, so a null result must
          #    be treated the same as a failed call; and a nonzero exit needs
          #    its error text inspected so a transient outage (5xx, DNS,
          #    timeout) fails the run instead of being folded into the same
          #    "no access" skip as an actual 401/403 - and a 403 caused by
          #    hitting a rate limit is neither: GitHub uses 403 for both, so
          #    that text is checked first and always fails the run rather
          #    than being read as "no access".
          set +e
          PREFLIGHT_OUTPUT=$(gh api graphql -f query='
            query($id:ID!){ node(id:$id){ ... on ProjectV2 { id } } }
          ' -f id="$PROJECT_ID" 2>&1)
          PREFLIGHT_STATUS=$?
          set -e

          auth_denied=0
          if [ "$PREFLIGHT_STATUS" -ne 0 ]; then
            if echo "$PREFLIGHT_OUTPUT" | grep -qi 'rate limit'; then
              echo "::error title=Project board sync failed::Preflight query hit a GitHub API rate limit, not an access problem - failing rather than masking it as a skip: $PREFLIGHT_OUTPUT" >&2
              exit 1
            elif echo "$PREFLIGHT_OUTPUT" | grep -qE 'HTTP (401|403)'; then
              auth_denied=1
            else
              echo "::error title=Project board sync failed::Preflight query errored, not an auth problem - failing rather than masking it as a skip: $PREFLIGHT_OUTPUT" >&2
              exit 1
            fi
          elif [ -z "$(echo "$PREFLIGHT_OUTPUT" | jq -r '.data.node.id // empty')" ]; then
            auth_denied=1
          fi

          if [ "$auth_denied" -eq 1 ]; then
            skip_or_fail "secrets.PROJECTS_TOKEN cannot read project $PROJECT_ID - expired, missing the 'project' scope, or not authorized for this owner."
          fi

          # 3. Read access to the project node is not write access: a
          #    read-only or mis-scoped-for-mutation token can pass the check
          #    above and still fail every addProjectV2ItemById /
          #    updateProjectV2ItemFieldValue call below. Classic PATs (which
          #    is what PROJECTS_TOKEN is documented to be, above) report their
          #    grants in the X-OAuth-Scopes response header; confirm 'project'
          #    is actually one of them before attempting any mutation.
          #
          #    The header is captured with `|| true` so a run under
          #    `set -e` doesn't abort here when grep finds no such header at
          #    all (fine-grained tokens don't send one) - the missing-header
          #    case is handled explicitly below, not by errexit. And scopes
          #    are compared as whole comma-separated entries, not with
          #    `grep -w`: `:` is a word-boundary character to grep, so `-w`
          #    would treat "project" as matching inside "read:project" too.
          #
          #    The `gh api` call and the header grep are captured separately:
          #    a failure of the `gh api` call itself (network, rate limit, a
          #    5xx) must not be swallowed the same way a merely-absent header
          #    is - only the latter is tolerated here, with `|| true` on the
          #    grep alone rather than on the whole pipeline.
          set +e
          RATE_LIMIT_RESPONSE=$(gh api -i /rate_limit 2>&1)
          RATE_LIMIT_STATUS=$?
          set -e
          if [ "$RATE_LIMIT_STATUS" -ne 0 ]; then
            echo "::error title=Project board sync failed::Could not query /rate_limit to check token scopes - failing rather than treating this as a missing-scope skip: $RATE_LIMIT_RESPONSE" >&2
            exit 1
          fi
          SCOPES_HEADER=$(echo "$RATE_LIMIT_RESPONSE" | grep -i '^x-oauth-scopes:' | tr -d '\r' || true)
          has_project_scope=0
          if [ -n "$SCOPES_HEADER" ]; then
            IFS=',' read -ra SCOPE_ARR <<< "${SCOPES_HEADER#*:}"
            for scope in "${SCOPE_ARR[@]}"; do
              # Trim surrounding whitespace.
              scope="${scope#"${scope%%[![:space:]]*}"}"
              scope="${scope%"${scope##*[![:space:]]}"}"
              if [ "$scope" = "project" ]; then
                has_project_scope=1
                break
              fi
            done
          fi
          if [ "$has_project_scope" -ne 1 ]; then
            skip_or_fail "secrets.PROJECTS_TOKEN does not carry the 'project' scope (${SCOPES_HEADER:-no X-OAuth-Scopes header returned}); it can read $PROJECT_ID but item mutations will fail."
          fi

          sync_one() {
            local NUM="$1"
            local STATE="$2"
            echo "---- sync #$NUM state=$STATE ----"

            ISSUE_NODE=$(gh api graphql -f query='
              query($owner:String!,$name:String!,$n:Int!){
                repository(owner:$owner,name:$name){ issue(number:$n){ id state } }
              }
            ' -f owner="$OWNER" -f name="$REPO" -F n="$NUM" --jq .data.repository.issue.id)

            if [ -z "$ISSUE_NODE" ] || [ "$ISSUE_NODE" = "null" ]; then
              echo "Could not resolve issue node for #$NUM" >&2
              return 1
            fi

            ITEM=$(gh api graphql -f query='
              mutation($projectId:ID!,$contentId:ID!){
                addProjectV2ItemById(input:{projectId:$projectId, contentId:$contentId}) {
                  item { id }
                }
              }
            ' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_NODE" --jq .data.addProjectV2ItemById.item.id)

            if [ -z "$ITEM" ] || [ "$ITEM" = "null" ]; then
              echo "addProjectV2ItemById failed for #$NUM" >&2
              return 1
            fi
            echo "item=$ITEM"

            if [ "$STATE" = "open" ]; then
              gh api graphql -f query='
                mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){
                  updateProjectV2ItemFieldValue(input:{
                    projectId:$projectId
                    itemId:$itemId
                    fieldId:$fieldId
                    value:{ singleSelectOptionId:$optionId }
                  }) { projectV2Item { id } }
                }
              ' -f projectId="$PROJECT_ID" -f itemId="$ITEM" -f fieldId="$STATUS_FIELD_ID" -f optionId="$OPT_READY" >/dev/null
              echo "status=Ready"
            else
              gh api graphql -f query='
                mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){
                  updateProjectV2ItemFieldValue(input:{
                    projectId:$projectId
                    itemId:$itemId
                    fieldId:$fieldId
                    value:{ singleSelectOptionId:$optionId }
                  }) { projectV2Item { id } }
                }
              ' -f projectId="$PROJECT_ID" -f itemId="$ITEM" -f fieldId="$STATUS_FIELD_ID" -f optionId="$OPT_DONE" >/dev/null
              gh api graphql -f query='
                mutation($projectId:ID!,$itemId:ID!){
                  archiveProjectV2Item(input:{projectId:$projectId, itemId:$itemId}) {
                    item { id isArchived }
                  }
                }
              ' -f projectId="$PROJECT_ID" -f itemId="$ITEM" >/dev/null
              echo "status=Done archived=true"
            fi
          }

          if [ "$EVENT_NAME" = "issues" ]; then
            sync_one "$ISSUE_NUM_EVENT" "$ISSUE_STATE_EVENT"
          elif [ -n "${DISPATCH_NUM:-}" ]; then
            STATE=$(gh api "repos/$OWNER/$REPO/issues/$DISPATCH_NUM" --jq .state)
            sync_one "$DISPATCH_NUM" "$STATE"
          else
            # Issues only (REST /issues includes PRs)
            mapfile -t NUMS < <(gh api "repos/$OWNER/$REPO/issues?state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | .number')
            echo "syncing ${#NUMS[@]} open issues (PRs excluded)"
            for n in "${NUMS[@]}"; do
              sync_one "$n" "open"
            done
          fi